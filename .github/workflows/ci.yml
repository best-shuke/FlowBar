name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RILL_VERSION: v0.1.5
  RILL_REVISION: b781566560480bb4e826fc9200d965c333612421

jobs:
  test:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            target_core: aarch64-apple-darwin
          - os: ubuntu-22.04
            system: linux
            target_core: x86_64-unknown-linux-musl
          - os: windows-2022
            system: windows
            target_core: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Locate core
        run: echo "CORE=$RUNNER_TEMP/rill/rill${{ matrix.system == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb dbus python3-gi

      - uses: ./.github/actions/build-core
        with:
          revision: ${{ env.RILL_REVISION }}
          target: ${{ matrix.target_core }}

      - name: Lint
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -- --test-threads=1

      - name: Package
        id: package
        run: |
          ./scripts/fetch-geo.sh "$RUNNER_TEMP/geo"
          case ${{ matrix.system }} in
            macos) ./scripts/build.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            linux) ./scripts/build-linux.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            windows) pwsh -File scripts/build-windows.ps1 -Core "$CORE" -Geo "$RUNNER_TEMP/geo" ;;
          esac

      # The packaged app, for trying a change on a real Mac before it is released. ditto keeps
      # the bundle's permissions and signatures, which the artifact upload alone would not.
      - name: Keep the macOS app
        if: matrix.system == 'macos'
        run: ditto -c -k --keepParent dist/FlowBar.app FlowBar-macos-arm64.zip

      - if: matrix.system == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: FlowBar-macos-arm64
          path: FlowBar-macos-arm64.zip
          retention-days: 14
          if-no-files-found: error

      # Real interface actions against the packaged app and core; TUN stays off.
      - name: UI smoke test
        run: |
          case ${{ matrix.system }} in
            linux)
              xvfb-run -a dbus-run-session -- python3 scripts/ui-smoke-test.py
              xvfb-run -a dbus-run-session -- python3 scripts/tray-smoke-test.py ;;
            windows) python scripts/ui-smoke-test.py ;;
            macos) python3 scripts/ui-smoke-test.py ;;
          esac

      - name: Installer smoke test
        if: matrix.system == 'windows'
        run: |
          PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION=0.0.0 -DARCH=x86_64 scripts/installer.nsi
          pwsh -File scripts/installer-smoke-test.ps1 dist/FlowBar-0.0.0-windows-x86_64-setup.exe

      - name: Persistent macOS helper smoke test
        if: ${{ !cancelled() && matrix.system == 'macos' && steps.package.outcome == 'success' }}
        run: python3 scripts/helper-smoke-test.py
