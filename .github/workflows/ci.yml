name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The bundled core: a rill release (https://github.com/best-shuke/rill/releases).
  RILL_VERSION: v0.1.0

jobs:
  test:
    name: ${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            target_core: aarch64-apple-darwin
            sha256: RILL_SHA256_AARCH64_APPLE_DARWIN
          - os: ubuntu-22.04
            system: linux
            target_core: x86_64-unknown-linux-musl
            sha256: RILL_SHA256_X86_64_UNKNOWN_LINUX_MUSL
          - os: windows-2022
            system: windows
            target_core: x86_64-pc-windows-msvc
            sha256: RILL_SHA256_X86_64_PC_WINDOWS_MSVC
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Locate core
        run: echo "CORE=$RUNNER_TEMP/rill/rill${{ matrix.system == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb dbus python3-gi

      - name: Lint
        run: |
          rustup component add clippy rustfmt
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked -- --test-threads=1

      - name: Package
        env:
          # Reads rill's release while that repository is private; empty otherwise.
          GH_TOKEN: ${{ secrets.RILL_TOKEN }}
        run: |
          ./scripts/fetch-rill.sh "$RILL_VERSION" ${{ matrix.target_core }} ${{ matrix.sha256 }} "$(dirname "$CORE")"
          ./scripts/fetch-geo.sh "$RUNNER_TEMP/geo"
          case ${{ matrix.system }} in
            macos) ./scripts/build.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            linux) ./scripts/build-linux.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            windows) pwsh -File scripts/build-windows.ps1 -Core "$CORE" -Geo "$RUNNER_TEMP/geo" ;;
          esac

      # Real interface actions against the packaged app and core; TUN stays off.
      - name: UI smoke test
        run: |
          case ${{ matrix.system }} in
            linux)
              xvfb-run -a dbus-run-session -- python3 scripts/ui-smoke-test.py
              xvfb-run -a dbus-run-session -- python3 scripts/tray-smoke-test.py ;;
            windows) python scripts/ui-smoke-test.py ;;
            macos) python3 scripts/ui-smoke-test.py ;;
          esac

      - name: Installer smoke test
        if: matrix.system == 'windows'
        run: |
          PATH="$PATH:/c/Program Files (x86)/NSIS"
          makensis -DVERSION=0.0.0 -DARCH=x86_64 scripts/installer.nsi
          pwsh -File scripts/installer-smoke-test.ps1 dist/FlowBar-0.0.0-windows-x86_64-setup.exe
