name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  # The bundled core: a rill release (https://github.com/best-shuke/rill/releases).
  RILL_VERSION: v0.1.1

jobs:
  build:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - os: macos-15
            system: macos
            arch: arm64
            target_core: aarch64-apple-darwin
            sha256: 6961ecc60f4cfabe39cbaf3c534bffb034299f08d741c16a077070540998e01a
          - os: ubuntu-22.04
            system: linux
            arch: x86_64
            target_core: x86_64-unknown-linux-musl
            sha256: ffa2f9f31e308c2e67add184b0fc83c25a30031ace630a961e07df43623d0990
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target_core: aarch64-unknown-linux-musl
            sha256: a614bcbc56ffcefa171874ccebef83ef4562ca6bd14509c1866b486e1e25229e
          - os: windows-2022
            system: windows
            arch: x86_64
            target_core: x86_64-pc-windows-msvc
            sha256: 5aa997fc72892b8fbf5b37ef004dde08a64603435eb5e48dcb98f6920d071d96
          # Cross-built: the x64 runner has the ARM64 MSVC tools.
          - os: windows-2022
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            target_core: aarch64-pc-windows-msvc
            sha256: fd32dc46244b18c65118b1562eba71d3eb7d47ef9025aa03df6a0d961efd8df6
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Locate core
        run: echo "CORE=$RUNNER_TEMP/rill/rill${{ matrix.system == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Check version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          PLIST_VERSION="$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' Resources/Info.plist)"
          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, Cargo.toml $CARGO_VERSION and Info.plist $PLIST_VERSION must match."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add ${{ matrix.target }}
          fi

      - name: Install Linux dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev

      - name: Fetch rill
        run: ./scripts/fetch-rill.sh "$RILL_VERSION" ${{ matrix.target_core }} ${{ matrix.sha256 }} "$(dirname "$CORE")"

      - name: Fetch Geo databases
        run: ./scripts/fetch-geo.sh "$RUNNER_TEMP/geo"

      # scripts/licenses.py reads the locked dependency sources offline.
      - name: Test
        run: |
          cargo fetch --locked
          if [ -z "${{ matrix.target }}" ]; then
            cargo test --locked -- --test-threads=1
          fi

      - name: Build
        run: |
          case ${{ matrix.system }} in
            macos) ./scripts/build.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            linux) ./scripts/build-linux.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            windows) pwsh -File scripts/build-windows.ps1 -Core "$CORE" -Target "${{ matrix.target }}" -Geo "$RUNNER_TEMP/geo" ;;
          esac

      - name: Package
        run: |
          ASSET="FlowBar-$VERSION-${{ matrix.system }}-${{ matrix.arch }}"
          case ${{ matrix.system }} in
            macos) ditto -c -k --keepParent dist/FlowBar.app "$ASSET.zip" ;;
            linux) tar -C dist -czf "$ASSET.tar.gz" FlowBar ;;
            # Python writes portable zip paths, which the in-app update unpacks with tar.
            windows)
              python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'FlowBar')" "$ASSET"
              PATH="$PATH:/c/Program Files (x86)/NSIS"
              makensis -DVERSION="$VERSION" -DARCH=${{ matrix.arch }} scripts/installer.nsi
              mv "dist/$ASSET-setup.exe" . ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}-${{ matrix.arch }}
          path: FlowBar-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Attached to every release, the install scripts stay at releases/latest/download.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 assets/
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          gh release create "$GITHUB_REF_NAME" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "FlowBar ${GITHUB_REF_NAME#v}" \
            --notes "macOS / Linux 在终端运行 \`curl -fsSL $DOWNLOAD/install.sh | sh\`；Windows 下载 \`setup.exe\` 双击安装，或在 PowerShell 运行 \`irm $DOWNLOAD/install.ps1 | iex\`。

          内置 rill $RILL_VERSION（MIT，https://github.com/best-shuke/rill/releases/tag/$RILL_VERSION）。
          内置的 geoip.metadb 和 GeoSite.dat 取自构建当天的 MetaCubeX/meta-rules-dat（GPL-3.0，https://github.com/MetaCubeX/meta-rules-dat）。" \
            --generate-notes
