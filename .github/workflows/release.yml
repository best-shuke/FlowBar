name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  RILL_VERSION: v0.1.5
  RILL_REVISION: b781566560480bb4e826fc9200d965c333612421

jobs:
  build:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            arch: arm64
            target_core: aarch64-apple-darwin
          - os: ubuntu-22.04
            system: linux
            arch: x86_64
            target_core: x86_64-unknown-linux-musl
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            target_core: aarch64-unknown-linux-musl
          - os: windows-2022
            system: windows
            arch: x86_64
            target_core: x86_64-pc-windows-msvc
          # Cross-built: the x64 runner has the ARM64 MSVC tools.
          - os: windows-2022
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            target_core: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Locate core
        run: echo "CORE=$RUNNER_TEMP/rill/rill${{ matrix.system == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Check version
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          VERSION="$CARGO_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          PLIST_VERSION="$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' Resources/Info.plist)"
          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, Cargo.toml $CARGO_VERSION and Info.plist $PLIST_VERSION must match."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb dbus python3-gi

      - uses: ./.github/actions/build-core
        with:
          revision: ${{ env.RILL_REVISION }}
          target: ${{ matrix.target_core }}

      - name: Fetch Geo databases
        run: ./scripts/fetch-geo.sh "$RUNNER_TEMP/geo"

      # scripts/licenses.py reads the locked dependency sources offline.
      - name: Test
        run: |
          cargo fetch --locked
          if [ -z "${{ matrix.target }}" ]; then
            cargo test --locked -- --test-threads=1
          fi

      - name: Build
        run: |
          case ${{ matrix.system }} in
            macos) ./scripts/build.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            linux) ./scripts/build-linux.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            windows) pwsh -File scripts/build-windows.ps1 -Core "$CORE" -Target "${{ matrix.target }}" -Geo "$RUNNER_TEMP/geo" ;;
          esac

      - name: Package
        run: |
          ASSET="FlowBar-$VERSION-${{ matrix.system }}-${{ matrix.arch }}"
          case ${{ matrix.system }} in
            macos) ditto -c -k --keepParent dist/FlowBar.app "$ASSET.zip" ;;
            linux) tar -C dist -czf "$ASSET.tar.gz" FlowBar ;;
            # Python writes portable zip paths, which the in-app update unpacks with tar.
            windows)
              python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'FlowBar')" "$ASSET"
              PATH="$PATH:/c/Program Files (x86)/NSIS"
              makensis -DVERSION="$VERSION" -DARCH=${{ matrix.arch }} scripts/installer.nsi
              mv "dist/$ASSET-setup.exe" . ;;
          esac

      - name: Native UI smoke test
        if: matrix.target == ''
        run: |
          case ${{ matrix.system }} in
            linux)
              xvfb-run -a dbus-run-session -- python3 scripts/ui-smoke-test.py
              xvfb-run -a dbus-run-session -- python3 scripts/tray-smoke-test.py ;;
            *) python3 scripts/ui-smoke-test.py ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}-${{ matrix.arch }}
          path: FlowBar-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Attached to every release, the install scripts stay at releases/latest/download.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 assets/
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          TAG="v$VERSION"
          NOTES_FILE="$RUNNER_TEMP/flowbar-release-notes.md"
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" > "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
          fi
          cat >> "$NOTES_FILE" <<EOF

          macOS / Linux 在终端运行 \`curl -fsSL $DOWNLOAD/install.sh | sh\`；Windows 下载 \`setup.exe\` 双击安装，或在 PowerShell 运行 \`irm $DOWNLOAD/install.ps1 | iex\`。

          内置 rill $RILL_VERSION，启用 XPro（MIT，固定源码提交 https://github.com/best-shuke/rill/commit/$RILL_REVISION）。
          内置的 geoip.metadb 和 GeoSite.dat 取自构建当天的 MetaCubeX/meta-rules-dat（GPL-3.0，https://github.com/MetaCubeX/meta-rules-dat）。
          EOF
          DRAFT=()
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then DRAFT=(--draft); fi
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FlowBar $VERSION" \
            --notes-file "$NOTES_FILE" \
            --generate-notes "${DRAFT[@]}"
