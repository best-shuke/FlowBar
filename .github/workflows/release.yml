name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

env:
  # The bundled core: a mihomo release (https://github.com/MetaCubeX/mihomo/releases).
  MIHOMO_VERSION: v1.19.33

jobs:
  build:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            system: macos
            arch: arm64
            core: darwin-arm64
            sha256: 060b64b0f2c9a310831db0fe4adb2878de67bfa606c311813c1f13966aa504b6
          - os: ubuntu-22.04
            system: linux
            arch: x86_64
            core: linux-amd64-compatible
            sha256: 386508bfb1c72c43b6a0eda73708ecdce82546581b0ebcb16366c53757c622b6
          - os: ubuntu-22.04-arm
            system: linux
            arch: arm64
            core: linux-arm64
            sha256: ba408b317080ee265c46cb923a50018c1b82cbd708551cdd46a1e3e307396187
          - os: windows-2022
            system: windows
            arch: x86_64
            core: windows-amd64-compatible
            sha256: 7aaf636a4f2172dcd8ec34ac4f52797b059195e5afd6409508c963e545f8864d
          # Cross-built: the x64 runner has the ARM64 MSVC tools.
          - os: windows-2022
            system: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            core: windows-arm64
            sha256: a2a26869a14634c49f3fbcecc593b498ed8591fbdd7616b24475b3d60b148da3
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Locate core
        run: echo "CORE=$RUNNER_TEMP/mihomo/mihomo${{ matrix.system == 'windows' && '.exe' || '' }}" >> "$GITHUB_ENV"

      - name: Check version
        run: |
          CARGO_VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          VERSION="$CARGO_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          PLIST_VERSION="$(sed -n 's/.*<key>CFBundleShortVersionString<\/key><string>\(.*\)<\/string>.*/\1/p' Resources/Info.plist)"
          if [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, Cargo.toml $CARGO_VERSION and Info.plist $PLIST_VERSION must match."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          if [ -n "${{ matrix.target }}" ]; then
            rustup target add ${{ matrix.target }}
          fi

      - name: Install Linux dependencies
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev xvfb dbus python3-gi

      # The token only lifts the API rate limit when a release download falls back to it.
      - name: Fetch mihomo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$CORE")"
          ./scripts/fetch-mihomo.sh "$MIHOMO_VERSION" ${{ matrix.core }} ${{ matrix.sha256 }} "$CORE"

      - name: Fetch Geo databases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-geo.sh "$RUNNER_TEMP/geo"

      # scripts/licenses.py reads the locked dependency sources offline.
      - name: Test
        run: |
          cargo fetch --locked
          if [ -z "${{ matrix.target }}" ]; then
            cargo test --locked -- --test-threads=1
          fi

      - name: Build
        run: |
          case ${{ matrix.system }} in
            macos) ./scripts/build.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            linux) ./scripts/build-linux.sh "$CORE" "$RUNNER_TEMP/geo" ;;
            windows) pwsh -File scripts/build-windows.ps1 -Core "$CORE" -Target "${{ matrix.target }}" -Geo "$RUNNER_TEMP/geo" ;;
          esac

      - name: Core smoke test
        if: matrix.target == ''
        run: python3 scripts/smoke-test.py

      - name: Package
        run: |
          ASSET="FlowBar-$VERSION-${{ matrix.system }}-${{ matrix.arch }}"
          case ${{ matrix.system }} in
            macos) ditto -c -k --keepParent dist/FlowBar.app "$ASSET.zip" ;;
            linux) tar -C dist -czf "$ASSET.tar.gz" FlowBar ;;
            # Python writes portable zip paths, which the in-app update unpacks with tar.
            windows)
              python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', 'dist', 'FlowBar')" "$ASSET"
              PATH="$PATH:/c/Program Files (x86)/NSIS"
              makensis -DVERSION="$VERSION" -DARCH=${{ matrix.arch }} scripts/installer.nsi
              mv "dist/$ASSET-setup.exe" . ;;
          esac

      - name: Native UI smoke test
        if: matrix.target == ''
        run: |
          case ${{ matrix.system }} in
            linux)
              xvfb-run -a dbus-run-session -- python3 scripts/ui-smoke-test.py
              xvfb-run -a dbus-run-session -- python3 scripts/tray-smoke-test.py ;;
            *) python3 scripts/ui-smoke-test.py ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.system }}-${{ matrix.arch }}
          path: FlowBar-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      # Attached to every release, the install scripts stay at releases/latest/download.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp scripts/install.sh scripts/install.ps1 assets/
          DOWNLOAD="https://github.com/$GITHUB_REPOSITORY/releases/latest/download"
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          TAG="v$VERSION"
          NOTES_FILE="$RUNNER_TEMP/flowbar-release-notes.md"
          if [ -f "docs/releases/$VERSION.md" ]; then
            cat "docs/releases/$VERSION.md" > "$NOTES_FILE"
          else
            : > "$NOTES_FILE"
          fi
          cat >> "$NOTES_FILE" <<EOF

          macOS / Linux 在终端运行 \`curl -fsSL $DOWNLOAD/install.sh | sh\`；Windows 下载 \`setup.exe\` 双击安装，或在 PowerShell 运行 \`irm $DOWNLOAD/install.ps1 | iex\`。

          内置 mihomo $MIHOMO_VERSION（GPL-3.0，源码：https://github.com/MetaCubeX/mihomo/tree/$MIHOMO_VERSION）。
          内置的 geoip.metadb 和 GeoSite.dat 取自构建当天的 MetaCubeX/meta-rules-dat（GPL-3.0，https://github.com/MetaCubeX/meta-rules-dat）。
          EOF
          DRAFT=()
          IS_DRAFT=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            DRAFT=(--draft)
            IS_DRAFT=true
          fi
          if EXISTING_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            if [ "$EXISTING_DRAFT" != true ]; then
              echo "::error::Release $TAG is already published."
              exit 1
            fi
            gh release upload "$TAG" assets/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "FlowBar $VERSION" \
              --notes-file "$NOTES_FILE" --draft="$IS_DRAFT"
          else
            gh release create "$TAG" assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "FlowBar $VERSION" \
              --notes-file "$NOTES_FILE" \
              --generate-notes "${DRAFT[@]}"
          fi
